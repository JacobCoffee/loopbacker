# Replaces GitHub's default CodeQL setup, which can't skip vendored code and whose Swift
# autobuild wedged the macOS runner. Categories match the old default setup so existing
# alerts and dismissals carry over.
#
# Swift runs weekly and on demand, not per push: CodeQL's Swift tracer builds for x86_64
# under Rosetta, and on the hosted macos-26 runner that traced build hasn't finished in any
# attempt (an untraced Rosetta build of the same tree takes 26 min, mostly vendored C++).
name: CodeQL

on:
  push:
    branches:
      - main
  pull_request:
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 120
    permissions:
      security-events: write
      actions: read
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - language: actions
            runner: ubuntu-latest
            build-mode: none
          - language: python
            runner: ubuntu-latest
            build-mode: none
          - language: c-cpp
            runner: ubuntu-latest
            build-mode: none

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}
          config: |
            paths-ignore:
              - App/Loopbacker/CAirwindows
              - App/Loopbacker/CRNNoise
              - App/Loopbacker/CWebRTCAEC
              - App/Loopbacker/CYSFX

      - name: Analyze
        uses: github/codeql-action/analyze@v4
        with:
          category: /language:${{ matrix.language }}

  analyze-swift:
    name: Analyze (swift)
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: macos-26
    timeout-minutes: 150
    permissions:
      security-events: write
      actions: read
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: swift
          build-mode: manual

      # Fewer parallel compiles than the default, to keep the Rosetta-traced build light.
      - name: Build Swift app
        working-directory: App/Loopbacker
        run: swift build -j 2

      - name: Analyze
        uses: github/codeql-action/analyze@v4
        with:
          category: /language:swift
