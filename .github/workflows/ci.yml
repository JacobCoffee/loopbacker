name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

jobs:
  build:
    name: Build
    runs-on: macos-26

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: brew install cmake

      - name: Build driver
        run: |
          cd Driver
          cmake -B build -DCMAKE_BUILD_TYPE=Release
          cmake --build build

      - name: Build Swift app
        run: |
          cd App/Loopbacker
          swift build -c release

      # Release: the factory-preset matrix runs 51 voice-chain passes and is skipped in
      # unoptimized builds. Swift's bounds and overflow checks stay on at -O.
      - name: Test Swift app
        run: |
          cd App/Loopbacker
          swift test -c release
